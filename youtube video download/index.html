<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-container { display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        #mp3Btn { background: #e67e22; } /* Orange for MP3 */
        #mp4Btn { background: #2980b9; } /* Blue for MP4 */
        button:disabled { background: #ccc !important; }
        #status { margin-top: 1rem; color: #555; }
    </style>
</head>
<body>

<div class="card">
    <h2>Media Downloader</h2>
    <input type="text" id="videoUrl" placeholder="Paste YouTube URL here...">
    <div class="btn-container">
        <button id="mp3Btn">Download MP3</button>
        <button id="mp4Btn">Download MP4</button>
    </div>
    <div id="status"></div>
</div>

<script>
    const status = document.getElementById('status');
    const mp3Btn = document.getElementById('mp3Btn');
    const mp4Btn = document.getElementById('mp4Btn');

    async function download(type) {
        const url = document.getElementById('videoUrl').value;
        if (!url) return alert('Please paste a URL');

        mp3Btn.disabled = true;
        mp4Btn.disabled = true;
        status.innerText = `Downloading ${type.toUpperCase()}... please wait.`;

        try {
            const response = await fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url, type: type }) // Sending the type
            });
            const result = await response.json();
            status.innerText = result.message;
        } catch (err) {
            status.innerText = "Error connecting to server.";
        } finally {
            mp3Btn.disabled = false;
            mp4Btn.disabled = false;
        }
    }

    mp3Btn.addEventListener('click', () => download('mp3'));
    mp4Btn.addEventListener('click', () => download('mp4'));
</script>

</body>
</html>
